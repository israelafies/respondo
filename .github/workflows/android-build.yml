name: Android build

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Compile, assemble, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Compile, assemble, and run unit tests
        run: ./gradlew :app:compileDebugSources :app:assembleDebug :app:testDebugUnitTest
